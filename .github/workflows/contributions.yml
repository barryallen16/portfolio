name: Refresh GitHub Contributions Snapshot

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-contributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and validate contributions JSON
        run: |
          curl -fsSL "https://github-contributions-api.jogruber.de/v4/barryallen16?y=last" -o gh-contributions.json.tmp
          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("gh-contributions.json.tmp","utf8")); if(!Array.isArray(d.contributions)||!d.contributions.length) process.exit(1);'
          mv gh-contributions.json.tmp gh-contributions.json

      - name: Commit updated snapshot if changed
        run: |
          if git diff --quiet gh-contributions.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gh-contributions.json
          git commit -m "update github contributions snapshot"
          git push
