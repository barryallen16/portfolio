<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jayadithya R — Resume</title>
    <meta
      name="description"
      content="Resume of Jayadithya R — AI/ML engineer building LLM systems, tokenizer infrastructure and data pipelines. Chennai, India."
    />
    <meta property="og:title" content="Jayadithya R — Resume" />
    <meta
      property="og:description"
      content="Resume of Jayadithya R — AI/ML engineer building LLM systems, tokenizer infrastructure and data pipelines."
    />
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://jayadithya.is-a.dev/resume" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://jayadithya.is-a.dev/resume" />
    <meta name="theme-color" content="#0e0e0e" />
    <link
      rel="shortcut icon"
      href="/favicon/favicon.ico"
      type="image/x-icon"
    />
    <style>
      @font-face {
        font-family: "Brunson";
        src: url("/fonts/brunson-display.woff2") format("woff2");
        font-display: swap;
      }
      @font-face {
        font-family: "GeistMono";
        src: url("/fonts/geistmono-regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      ::selection {
        background: #a3e635;
        color: #0e0e0e;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0e0e0e;
        color: rgb(255 255 255 / 0.4);
        font-family: "GeistMono", ui-monospace, SFMono-Regular, monospace;
        font-size: 14px;
      }
      .bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 3.25rem;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0 0.75rem;
        background: rgb(14 14 14 / 0.82);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgb(255 255 255 / 0.1);
      }
      .bar a {
        text-decoration: none;
        color: rgb(255 255 255 / 0.4);
        transition: color 0.15s ease;
      }
      .bar a:hover,
      .bar a:focus-visible {
        color: #a3e635;
      }
      .who {
        font-family: "Brunson", ui-sans-serif, system-ui, sans-serif;
        font-size: 1rem;
        color: rgb(255 255 255 / 0.85);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .who span {
        font-family: "GeistMono", ui-monospace, monospace;
        font-size: 0.75rem;
        color: rgb(255 255 255 / 0.4);
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        flex-shrink: 0;
      }
      .btn {
        display: inline-block;
        padding: 0.4rem 0.6rem;
        font-size: 0.75rem;
        border: 2px solid rgb(255 255 255 / 0.1);
        border-radius: 0.5rem;
        background: #171717;
        white-space: nowrap;
      }
      .btn.primary {
        color: rgb(163 230 53 / 0.9);
        border-color: rgb(163 230 53 / 0.35);
      }
      .btn.primary:hover,
      .btn.primary:focus-visible {
        color: #0e0e0e;
        background: #a3e635;
        border-color: #a3e635;
      }
      .frame {
        position: fixed;
        top: 3.25rem;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: calc(100% - 3.25rem);
        border: 0;
        background: #0e0e0e;
      }
      .fallback {
        position: fixed;
        top: 3.25rem;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        text-align: center;
        padding: 1.5rem;
      }
      .fallback p {
        margin: 0;
        line-height: 1.6;
      }
      .fallback .btn {
        font-size: 0.8125rem;
        padding: 0.6rem 0.9rem;
      }
      @media (max-width: 520px) {
        .who span {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <a href="/" aria-label="back to portfolio">
        <span class="who">Jayadithya R <span>&mdash; resume</span></span>
      </a>
      <div class="actions">
        <a class="btn" href="/">portfolio</a>
        <a
          class="btn primary"
          href="/resume/Jayadithya_R_Master_Resume.pdf"
          download
          >download pdf</a
        >
      </div>
    </div>

    <object
      data="/resume/Jayadithya_R_Master_Resume.pdf#view=FitH"
      type="application/pdf"
      class="frame"
      aria-label="Jayadithya R resume (PDF)"
    >
      <div class="fallback">
        <p>
          Your browser can't display the PDF inline.<br />
          Open or download it instead:
        </p>
        <a
          class="btn primary"
          href="/resume/Jayadithya_R_Master_Resume.pdf"
          target="_blank"
          rel="noopener"
          >open the resume (pdf)</a
        >
      </div>
    </object>
  </body>
</html>
